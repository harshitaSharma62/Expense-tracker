<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
</head>

<body>

    <h2>Expense Tracker</h2>

    <form>
        <label>Expense Description:</label><br>
        <!-- add id here -->
        <input type="text" id="description" placeholder="Enter Description"><br><br>

        <label>Amount:</label><br>
        <!-- add id here -->
        <input type="number" id="amount" placeholder="Enter Amount"><br><br>

        <label>Category:</label><br>
        <!-- add id here -->
        <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>
        </select><br><br>

        <button type="button" onclick="addExpense()">Add Expense</button>
    </form>

    <h3>Expense List</h3>

    <table border="1">
        <tr>
            <th>Description</th>
            <th>Amount</th>
            <th>Category</th>
        </tr>

        <!-- remove old rows and add tbody -->
        <tbody id="expenseTable"></tbody>
    </table>

    <!-- add id here -->
    <h3 id="total">Total: ₹0</h3>

    <script type="module" src="script.js"></script>

</body>
</html>
